<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050716" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23050716'/%3E%3Cpath d='M32 8l6 18 18 6-18 6-6 18-6-18-18-6 18-6z' fill='%239affe0'/%3E%3C/svg%3E"
    />
    <title>Aurora Flux</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #f0ffff;
        --muted: #90a7c8;
        --cyan: #72f8ff;
        --mint: #9affe0;
        --violet: #a984ff;
        --pink: #ff78ce;
        --panel: rgba(7, 11, 34, 0.76);
        --line: rgba(119, 242, 255, 0.42);
        --lap-progress: 0%;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #04060f;
        color: var(--ink);
        font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      }

      body::after {
        position: fixed;
        inset: 0;
        z-index: 2;
        pointer-events: none;
        content: "";
        background: linear-gradient(
          110deg,
          rgba(11, 254, 217, 0.035),
          transparent 30%,
          rgba(180, 87, 255, 0.04) 78%,
          transparent
        );
        mix-blend-mode: screen;
      }

      #app {
        position: fixed;
        inset: 0;
      }

      #app > canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      #race-hud {
        position: fixed;
        inset: 0;
        z-index: 4;
        pointer-events: none;
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.55);
      }

      .hud-brand,
      .hud-lap-panel,
      .hud-timer,
      .hud-position,
      .hud-hazard,
      .hud-map,
      .hud-boost {
        position: absolute;
        background: linear-gradient(
          115deg,
          rgba(7, 12, 37, 0.82),
          rgba(10, 21, 54, 0.54)
        );
        border: 1px solid var(--line);
        box-shadow:
          0 0 22px rgba(76, 202, 255, 0.08),
          inset 0 0 18px rgba(142, 106, 255, 0.06);
        backdrop-filter: blur(8px);
      }

      .hud-brand {
        top: 28px;
        left: 32px;
        display: grid;
        grid-template-columns: 23px auto;
        column-gap: 9px;
        align-items: center;
        padding: 9px 18px 10px 11px;
        border-width: 0 0 1px 1px;
        border-color: rgba(154, 255, 224, 0.5);
        clip-path: polygon(0 0, 100% 0, 92% 100%, 0 100%);
      }

      .brand-mark {
        color: var(--mint);
        font-size: 19px;
        line-height: 1;
      }
      .hud-brand span:not(.brand-mark) {
        font-size: 17px;
        font-weight: 700;
        letter-spacing: 0.12em;
      }
      .hud-brand small {
        grid-column: 2;
        color: var(--muted);
        font-size: 8px;
        letter-spacing: 0.2em;
      }

      .hud-kicker {
        display: block;
        color: var(--muted);
        font-size: 9px;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      .hud-lap-panel {
        top: 28px;
        left: 50%;
        width: 172px;
        padding: 10px 14px 12px;
        transform: translateX(-50%);
      }
      .hud-lap-panel strong {
        display: block;
        margin-top: 3px;
        font-size: 24px;
        letter-spacing: 0.08em;
      }
      .hud-lap-panel i {
        color: var(--muted);
        font-size: 14px;
        font-style: normal;
      }
      .lap-track {
        height: 3px;
        margin-top: 8px;
        overflow: hidden;
        background: rgba(146, 176, 255, 0.2);
      }
      .lap-track span {
        display: block;
        width: var(--lap-progress);
        height: 100%;
        background: linear-gradient(
          90deg,
          var(--mint),
          var(--cyan),
          var(--violet)
        );
        box-shadow: 0 0 10px var(--cyan);
      }

      .hud-timer {
        top: 28px;
        right: 32px;
        padding: 10px 14px;
        text-align: right;
      }
      .hud-timer strong {
        display: block;
        margin-top: 3px;
        font-size: 20px;
        font-variant-numeric: tabular-nums;
        letter-spacing: 0.04em;
      }

      .hud-position {
        top: 112px;
        right: 32px;
        display: flex;
        align-items: flex-end;
        gap: 9px;
        padding: 9px 14px 11px;
        border-color: rgba(255, 120, 206, 0.5);
      }
      .hud-position > strong {
        color: var(--pink);
        font-size: 47px;
        font-style: italic;
        line-height: 0.82;
        letter-spacing: -0.08em;
      }
      .hud-position b,
      .hud-position small {
        display: block;
      }
      .hud-position b {
        color: var(--ink);
        font-size: 14px;
      }
      .hud-position small {
        margin-top: 4px;
        color: var(--muted);
        font-size: 9px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      .hud-hazard {
        bottom: 170px;
        left: 32px;
        display: flex;
        align-items: center;
        gap: 11px;
        min-width: 196px;
        padding: 10px 14px;
        border-color: rgba(255, 177, 105, 0.45);
      }
      .hazard-dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--mint);
        box-shadow: 0 0 12px var(--mint);
      }
      .hud-hazard strong,
      .hud-hazard small {
        display: block;
      }
      .hud-hazard strong {
        margin-top: 3px;
        color: var(--ink);
        font-size: 12px;
        letter-spacing: 0.08em;
      }
      .hud-hazard small {
        margin-top: 3px;
        color: var(--muted);
        font-size: 10px;
      }
      #race-hud.hazard-active .hud-hazard {
        border-color: rgba(255, 120, 206, 0.85);
      }
      #race-hud.hazard-active .hazard-dot {
        background: var(--pink);
        box-shadow: 0 0 15px var(--pink);
      }

      .hud-map {
        right: 32px;
        bottom: 120px;
        width: 240px;
        padding: 9px 10px 7px;
        border-color: rgba(169, 132, 255, 0.5);
      }
      .hud-map canvas {
        display: block;
        width: 100%;
        height: auto;
        margin-top: 5px;
        opacity: 0.92;
      }

      .hud-speed {
        position: absolute;
        bottom: 35px;
        left: 32px;
        width: 235px;
      }
      .hud-speed span {
        display: block;
        color: var(--ink);
        font-size: 74px;
        font-style: italic;
        font-weight: 900;
        line-height: 0.8;
        letter-spacing: -0.1em;
        text-shadow:
          3px 3px 0 #1c2b62,
          0 0 20px rgba(114, 248, 255, 0.32);
      }
      .hud-speed small {
        margin-left: 6px;
        color: var(--cyan);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.22em;
        text-transform: uppercase;
      }
      .hud-speed i {
        position: absolute;
        left: 4px;
        bottom: 9px;
        width: 106px;
        height: 1px;
        transform-origin: 0 50%;
        background: var(--pink);
        box-shadow: 0 0 8px var(--pink);
      }

      .hud-boost {
        bottom: 41px;
        left: 50%;
        width: min(370px, 34vw);
        padding: 10px 13px 11px;
        transform: translateX(-50%);
        border-color: rgba(154, 255, 224, 0.42);
      }
      .boost-heading {
        display: flex;
        justify-content: space-between;
        color: var(--muted);
        font-size: 10px;
        letter-spacing: 0.09em;
      }
      .boost-heading strong {
        color: var(--mint);
        font-size: 10px;
        letter-spacing: 0.12em;
      }
      .boost-track {
        height: 8px;
        margin-top: 8px;
        padding: 1px;
        background: rgba(126, 155, 217, 0.2);
      }
      .boost-track span {
        display: block;
        width: 0;
        height: 100%;
        background: repeating-linear-gradient(
          110deg,
          var(--mint) 0 12px,
          var(--cyan) 12px 20px
        );
        box-shadow: 0 0 12px var(--cyan);
        transition: width 80ms linear;
      }
      .hud-boost small {
        display: block;
        margin-top: 7px;
        color: var(--muted);
        font-size: 9px;
      }

      .hud-controls {
        position: absolute;
        right: 32px;
        bottom: 35px;
        color: var(--muted);
        font-size: 10px;
        letter-spacing: 0.04em;
      }
      kbd {
        display: inline-block;
        margin: 0 3px 0 8px;
        padding: 3px 5px;
        color: var(--ink);
        border: 1px solid rgba(114, 248, 255, 0.45);
        background: rgba(13, 28, 66, 0.75);
        font: inherit;
        font-weight: 700;
      }

      #fps-overlay {
        position: fixed;
        top: 116px;
        left: 32px;
        z-index: 5;
        min-width: 166px;
        padding: 7px 10px;
        color: var(--muted);
        background: rgba(4, 7, 19, 0.4);
        border-left: 1px solid rgba(144, 167, 200, 0.3);
        font-family: ui-monospace, monospace;
        font-size: 10px;
        line-height: 1.35;
        opacity: 0.72;
        pointer-events: none;
      }
      #fps-overlay .row {
        display: flex;
        justify-content: space-between;
        gap: 12px;
      }
      #fps-overlay .label {
        color: rgba(207, 230, 255, 0.52);
      }
      #fps-overlay .value {
        color: var(--mint);
      }
      #fps-overlay .value.warn {
        color: #ffd28a;
      }
      #fps-overlay .value.bad {
        color: #ff8a8a;
      }

      #race-status {
        position: fixed;
        top: 46%;
        left: 50%;
        z-index: 7;
        transform: translate(-50%, -50%) scale(0.78) skewX(-9deg);
        color: #edffff;
        font-size: clamp(66px, 13vw, 168px);
        font-weight: 900;
        font-style: italic;
        letter-spacing: 0.06em;
        opacity: 0;
        pointer-events: none;
        text-shadow:
          5px 5px 0 #18204a,
          0 0 28px var(--cyan);
        transition:
          opacity 130ms ease-out,
          transform 130ms ease-out;
      }
      #race-status.visible {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1) skewX(-9deg);
      }
      #race-status[data-state="warning"] {
        color: #ffb8df;
        text-shadow:
          5px 5px 0 #4a153d,
          0 0 28px var(--pink);
        font-size: clamp(42px, 9vw, 110px);
      }

      #results-screen[hidden] {
        display: none;
      }
      #results-screen {
        position: fixed;
        inset: 0;
        z-index: 8;
        display: grid;
        place-items: center;
        background: rgba(4, 6, 18, 0.72);
        backdrop-filter: blur(12px);
      }
      .results-card {
        width: min(470px, calc(100vw - 40px));
        padding: 36px 40px 32px;
        text-align: center;
        background: linear-gradient(
          135deg,
          rgba(12, 18, 55, 0.94),
          rgba(27, 11, 56, 0.94)
        );
        border: 1px solid rgba(154, 255, 224, 0.65);
        box-shadow: 0 0 50px rgba(120, 82, 255, 0.22);
        clip-path: polygon(0 0, 96% 0, 100% 9%, 100% 100%, 4% 100%, 0 91%);
      }
      .results-card .hud-kicker {
        color: var(--mint);
      }
      .results-card h1 {
        margin: 7px 0 22px;
        color: var(--ink);
        font-size: 45px;
        font-style: italic;
        letter-spacing: 0.06em;
      }
      .result-stats {
        display: grid;
        grid-template-columns: 1fr 1fr;
        margin-bottom: 26px;
        border-top: 1px solid rgba(144, 167, 200, 0.25);
        border-bottom: 1px solid rgba(144, 167, 200, 0.25);
      }
      .result-stats div {
        padding: 14px 6px;
      }
      .result-stats div + div {
        border-left: 1px solid rgba(144, 167, 200, 0.25);
      }
      .result-stats strong {
        display: block;
        margin-top: 4px;
        color: var(--pink);
        font-size: 27px;
      }
      .result-stats div:last-child strong {
        color: var(--cyan);
      }
      #restart-race {
        padding: 11px 27px;
        color: #071129;
        border: 0;
        background: linear-gradient(100deg, var(--mint), var(--cyan));
        box-shadow: 0 0 18px rgba(114, 248, 255, 0.32);
        cursor: pointer;
        font: inherit;
        font-weight: 800;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }
      #restart-race:focus-visible {
        outline: 2px solid #fff;
        outline-offset: 4px;
      }

      @media (max-width: 760px) {
        .hud-brand,
        .hud-timer,
        .hud-position,
        .hud-map,
        .hud-hazard {
          left: 14px;
          right: auto;
        }
        .hud-brand {
          top: 14px;
        }
        .hud-timer {
          top: 14px;
          right: 14px;
          left: auto;
        }
        .hud-lap-panel {
          top: 78px;
          left: 14px;
          width: 150px;
          transform: none;
        }
        .hud-position {
          top: 92px;
          left: auto;
          right: 14px;
        }
        .hud-hazard {
          bottom: 146px;
          left: 14px;
          min-width: 170px;
        }
        .hud-map {
          left: auto;
          right: 14px;
          bottom: 112px;
          width: 174px;
        }
        .hud-speed {
          bottom: 25px;
          left: 14px;
          width: 165px;
        }
        .hud-speed span {
          font-size: 53px;
        }
        .hud-boost {
          left: auto;
          right: 14px;
          bottom: 25px;
          width: 185px;
          transform: none;
        }
        .hud-controls,
        #fps-overlay {
          display: none;
        }
        #race-status {
          top: 43%;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          transition-duration: 0.001ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="race-hud" aria-live="polite"></div>
    <div id="fps-overlay" aria-hidden="true"></div>
    <div id="race-status" aria-live="assertive"></div>
    <section id="results-screen" hidden aria-label="Race results">
      <div class="results-card">
        <span class="hud-kicker">Nebula circuit / finish confirmed</span>
        <h1>Race complete</h1>
        <div class="result-stats">
          <div>
            <span class="hud-kicker">Position</span
            ><strong id="result-place">04 / 04</strong>
          </div>
          <div>
            <span class="hud-kicker">Time</span
            ><strong id="result-time">00:00.00</strong>
          </div>
        </div>
        <button id="restart-race" type="button">Race again</button>
      </div>
    </section>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
